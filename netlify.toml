[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # This tells Netlify to ignore these keys when scanning for secrets
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_INTERSWITCH_MODE,NEXT_PUBLIC_INTERSWITCH_MERCHANT_CODE,NEXT_PUBLIC_INTERSWITCH_PAY_ITEM_ID"